[package]
name = "mc-return"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mc-blockchain-types = { workspace = true }
mc-transaction-core = { workspace = true }
mc-crypto-keys = { workspace = true }
mc-crypto-digestible = { workspace = true }

# Not in [workspace.dependencies] and the root manifest is not ours to edit, so
# these three are path deps. mc-light-client-verifier is MobileCoin's OWN quorum
# checker; the relayer runs it against every bundle it builds, so a bundle that
# leaves this process has already been accepted by upstream code rather than by
# a reimplementation of upstream code.
mc-light-client-verifier = { path = "../../vendor/mobilecoin/light-client/verifier" }
mc-consensus-scp-types = { path = "../../vendor/mobilecoin/consensus/scp/types" }
mc-common = { path = "../../vendor/mobilecoin/common" }

serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mc-account-keys = { path = "../../vendor/mobilecoin/account-keys" }
mc-util-from-random = { path = "../../vendor/mobilecoin/util/from-random" }

curve25519-dalek = { workspace = true }
rand_core = { workspace = true }
rand_chacha = { workspace = true }
